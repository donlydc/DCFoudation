# Machine-readable context map (MP §3.4). POINTERS ONLY - never copy code; source/build files remain truth.
# Written by R1.0 from reports/baseline-verification.md Part A + module build files + codegraph_explore.
# Consumed by tools/check_architecture.py (R1.3). Update in the same WP that changes a module's API/deps (MP §10.4).
#
# Schema (schema_version: 1)
#   modules[]:   id, gradle_path, kind (jvm|android-library|android-app|included-build), doc,
#                source_roots[], test_roots[] (existing dirs only), entry_symbols[] (2-12 real symbols; add more when a documented flow needs them),
#                depends_on[] (production project deps), test_depends_on[] (test-only project deps),
#                owners_rules[] (rule IDs from architecture/01..24), doc_status, test_status, evidence
#                (test_depends_on is optional; omitted when a module has no test-only project deps)
#   features[]:  id, package, owning_module, doc, entry_symbols[], depends_on_modules[], owners_rules[], doc_status, test_status, evidence
#   doc_status:  DRAFT | VERIFIED | NEEDS_REFRESH      (freshness of the doc page; VERIFIED needs commit + audit date in the page)
#   test_status: NOT_RUN | TESTED | FAILED | BLOCKED   (TESTED/FAILED require an evidence path under reports/)
#   test_roots: every listed dir exists (lane A2 added src/test to platform-navigation, platform-permission, observability).
#   owners_rules use BARE rule IDs defined in architecture/01..24 (e.g. PERM-01 = 13-permissions.md); master-plan backlog items are written MP:<ID> and never appear here (see context-protocol.md "ID convention").
schema_version: 1
root_architecture: architecture/00-index.md
protocol: architecture/context-protocol.md
rules:
